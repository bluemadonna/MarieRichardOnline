<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гостевая книга - MarieRichardOnline.com</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="wrapper">

  <div id="site-header"></div>

  <div id="page-grid">
    <div id="leftbar"><div id="site-leftbar"></div></div>

    <div id="main-col">
      <h2>Гостевая книга ♥</h2>
      <div class="content-box">
        <p>Оставь сообщение! Расскажи, что думаешь о сайте, о Мари, или просто поздоровайся ☆ Пожалуйста, без спама и грубостей — это дружелюбное место для фанатов, хейтерам тут не рады!</p>
      </div>

      <h3>★ Записи</h3>
      <div id="gb-list"><i>загрузка записей...</i></div>

      <div class="sparkle-divider">✦ ✧ ✦ ✧ ✦</div>

      <h3>★ Оставить запись</h3>
      <div class="gb-form">
        <form id="gb-form" onsubmit="MRO.submitGuestbookEntry('gb-form','gb-list'); return false;">
          <label for="gbname">Имя / никнейм:</label>
          <input type="text" id="gbname" name="gbname">

          <label for="gbmsg">Сообщение:</label>
          <textarea id="gbmsg" name="gbmsg" rows="4"></textarea>

          <input type="submit" value="Оставить запись ♥">
          <div class="gb-status" id="gb-status"></div>
        </form>
      </div>
    </div>

    <div id="rightbar"><div id="site-rightbar"></div></div>
  </div>

  <div id="site-footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/mro-data.js"></script>
<script src="js/include.js"></script>
<script>
MRO.loadGuestbook('gb-list');
</script>
  <script type="module">
    import { fairyDustCursor } from "https://unpkg.com/cursor-effects@latest/dist/esm.js";
    new fairyDustCursor({
      colors: ["#ff2d95", "#fff34d", "#ff8fc7", "#c2185b"],
      fairySymbol: "★"
    });
  </script>

</body>
</html>
