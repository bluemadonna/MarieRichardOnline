<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОпРоСы ♥ MarieRichardOnline.com</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="images/site/favicon.gif" type="image/gif">
</head>
<body>
<div id="wrapper">

  <div id="site-header"></div>

  <div id="page-grid">
    <div id="leftbar"><div id="site-leftbar"></div></div>

    <div id="main-col">
      <h2>♥ Опросы ♥</h2>

      <div class="content-box">
        <h3>Опрос недели: какой альбом Мари твой любимый?</h3>
        <div id="poll-full-options">
          <p><label><input type="radio" name="pollfull" value="Album 1"> [Album 1]</label></p>
          <p><label><input type="radio" name="pollfull" value="Album 2"> [Album 2]</label></p>
          <p><label><input type="radio" name="pollfull" value="Album 3"> [Album 3]</label></p>
          <p><label><input type="radio" name="pollfull" value="Album 4"> [Album 4]</label></p>
        </div>
        <button type="button" onclick="MRO.submitFullVote('favorite-album','pollfull','poll-results')"
          style="background:var(--pink-main); color:#fff; font-weight:bold; border:none; border-radius:3px; padding:6px 16px; font-family:'Baloo 2',cursive; cursor:pointer;">
          Голосовать
        </button>
        <div id="poll-results" style="margin-top:10px; font-size:12px;"></div>
      </div>

      <div class="sparkle-divider"> </div>

      <h3>(¯`•._.★ АрХиВ ОпРоСоВ ★._.•´¯)</h3>
      <div id="poll-archive"></div>
    </div>

    <div id="rightbar"><div id="site-rightbar"></div></div>
  </div>

  <div id="site-footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/mro-data.js"></script>
<script src="js/include.js"></script>
<script src="js/gallery-pagination.js"></script>
<script src="js/router.js"></script>
<script src="js/countdown.js"></script>
<script src="js/player.js"></script>
<script src="js/lightbox.js"></script>
<script data-page-init="true">
MRO.initFullPoll('favorite-album','poll-results');

// Архив прошлых опросов — реальные результаты из базы.
// Когда решишь завершить текущий опрос и запустить новый:
// 1) добавь сюда старый вопрос с его poll_id
// 2) смени значение favorite-album выше (и в rightbar.html) на новый poll_id + новый вопрос/варианты
var pastPolls = [
  // { id: 'старый-poll-id', question: 'Текст прошлого вопроса' },
  { id: 'fave-single-feb2001', question: 'Любимый сингл с дебютного альбома?' },
  { id: 'fave-look-feb2001', question: 'Любимый лук за 2001 год?' },
];
MRO.renderPollArchive('poll-archive', pastPolls);
</script>
<script type="module" src="js/cursor.js"></script>

</body>
</html>
