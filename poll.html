<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Опросы - MarieRichardOnline.com</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="lang-ru">
<div id="wrapper">

  <div id="site-header"></div>

  <div id="page-grid">
    <div id="leftbar"><div id="site-leftbar"></div></div>

    <div id="main-col">
      <h2>Опросы ♥</h2>

      <div class="content-box">
        <h3 style="margin-top:0;">Опрос недели: какой альбом Мари твой любимый?</h3>
        <div id="poll-full-options">
          <p><label><input type="radio" name="pollfull" value="Album 1"> [Album 1]</label></p>
          <p><label><input type="radio" name="pollfull" value="Album 2"> [Album 2]</label></p>
          <p><label><input type="radio" name="pollfull" value="Album 3"> [Album 3]</label></p>
          <p><label><input type="radio" name="pollfull" value="Album 4"> [Album 4]</label></p>
        </div>
        <button type="button" onclick="MRO.submitFullVote('favorite-album','pollfull','poll-results')"
          style="background:var(--pink-bar); color:#fff; font-weight:bold; border:none; border-radius:3px; padding:6px 16px; font-family:'Baloo 2',cursive; cursor:pointer;">
          Голосовать!
        </button>
        <div id="poll-results" style="margin-top:10px; font-size:12px;"></div>
      </div>

      <p style="font-size:11px; color:#a9698f;">Голосование анонимное, без аккаунтов — можно проголосовать сколько угодно раз (мини-опрос в правом блоке считает те же голоса).</p>

      <div class="sparkle-divider">✦ ✧ ✦ ✧ ✦</div>

      <h3>★ Архив прошлых опросов</h3>
      <div id="poll-archive"></div>
    </div>

    <div id="rightbar"><div id="site-rightbar"></div></div>
  </div>

  <div id="site-footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="mro-data.js"></script>
<script src="include.js"></script>
<script>
MRO.initFullPoll('favorite-album','poll-results');

// Архив прошлых опросов — реальные результаты из базы.
// Когда решишь завершить текущий опрос и запустить новый:
// 1) добавь сюда старый вопрос с его poll_id
// 2) смени значение favorite-album выше (и в rightbar.html) на новый poll_id + новый вопрос/варианты
var pastPolls = [
  // { id: 'старый-poll-id', question: 'Текст прошлого вопроса' },
];
MRO.renderPollArchive('poll-archive', pastPolls);
</script>
  <script type="module">
    import { fairyDustCursor } from "https://unpkg.com/cursor-effects@latest/dist/esm.js";
    new fairyDustCursor({
      colors: ["#ff2d95", "#fff34d", "#ff8fc7", "#c2185b"],
      fairySymbol: "★"
    });
  </script>

</body>
</html>
